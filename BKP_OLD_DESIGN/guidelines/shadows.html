<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;box-sizing:border-box}*{box-sizing:border-box}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px}
.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border)}
.n{font:600 13px/18px var(--font-sans)}.v{font:500 12px/16px var(--font-mono);color:var(--ink-muted)}
.lbl{font:500 12px/16px var(--font-sans);letter-spacing:.02em;color:var(--ink-muted)}</style></head><body><div style="display:flex;gap:40px;align-items:center;flex-wrap:wrap;padding:8px"><div style="display:flex;flex-direction:column;gap:10px"><div style="width:180px;height:80px;background:var(--surface-000);border-radius:var(--radius-md);box-shadow:var(--shadow-card)"></div><span class="n">shadow-card</span></div><div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><div style="width:72px;height:72px;border-radius:var(--radius-full);background:var(--danger);box-shadow:var(--shadow-fab)"></div><span class="n">shadow-fab</span></div></div></body></html>
