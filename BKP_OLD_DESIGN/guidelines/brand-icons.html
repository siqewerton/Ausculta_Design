<!-- @dsCard group="Brand" viewport="700x140" name="Iconografia" subtitle="Lucide, traço 2px, sem preenchimento; estado = ícone + palavra" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;box-sizing:border-box}*{box-sizing:border-box}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px}
.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border)}
.n{font:600 13px/18px var(--font-sans)}.v{font:500 12px/16px var(--font-mono);color:var(--ink-muted)}
.lbl{font:500 12px/16px var(--font-sans);letter-spacing:.02em;color:var(--ink-muted)}</style></head><body><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
 <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center"><span style="display:inline-flex;gap:8px;align-items:center;color:var(--ink);font:600 14px/20px var(--font-sans)"><i data-lucide="mic" style="width:22px;height:22px;stroke-width:2"></i>Gravar</span><span style="display:inline-flex;gap:8px;align-items:center;color:var(--success);font:600 14px/20px var(--font-sans)"><i data-lucide="circle-check" style="width:22px;height:22px;stroke-width:2"></i>Sincronizado</span><span style="display:inline-flex;gap:8px;align-items:center;color:var(--accent-warm-text);font:600 14px/20px var(--font-sans)"><i data-lucide="wifi-off" style="width:22px;height:22px;stroke-width:2"></i>Offline</span><span style="display:inline-flex;gap:8px;align-items:center;color:var(--danger);font:600 14px/20px var(--font-sans)"><i data-lucide="triangle-alert" style="width:22px;height:22px;stroke-width:2"></i>Revisar dose</span><span style="display:inline-flex;gap:8px;align-items:center;color:var(--brand);font:600 14px/20px var(--font-sans)"><i data-lucide="stethoscope" style="width:22px;height:22px;stroke-width:2"></i>Consulta</span></div>
 <script>lucide.createIcons({attrs:{'stroke-width':2}})</script></body></html>
