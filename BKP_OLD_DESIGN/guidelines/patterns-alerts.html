<!-- @dsCard group="Patterns" viewport="700x260" name="Faixas de alerta e selos" subtitle="Vermelho = risco; laranja = atenção; selo 6px" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;margin:0}*{box-sizing:border-box}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.lbl{font:600 12px/16px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 8px}
.c{min-height:44px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-full);font:600 13px/18px var(--font-sans);border:2px solid}
.n{font:400 13px/18px var(--font-sans);color:var(--ink-muted);margin:4px 0 16px}</style></head><body>
<p class="lbl">Faixa de alerta (cabeçalho do paciente)</p>
<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
<div style="display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:var(--radius-sm);background:var(--danger-subtle);color:var(--danger);font:600 14px/20px var(--font-sans)"><span style="width:18px;height:18px;flex:none;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/triangle-alert.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/triangle-alert.svg) center/contain no-repeat"></span>Alergia: Dipirona (vômito após a dose)</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-radius:var(--radius-sm);background:var(--accent-warm-subtle);color:var(--accent-warm-text);font:600 14px/20px var(--font-sans)"><span style="width:18px;height:18px;flex:none;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/list-ordered.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/list-ordered.svg) center/contain no-repeat"></span><span style="flex:1">Problema ativo: Claudicação membro pélvico <span style="font-weight:400">· Desde 29/09</span></span><span class="c" style="border-color:var(--accent-warm-text);background:var(--surface-000);color:var(--accent-warm-text)"><span style="width:14px;height:14px;flex:none;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/check.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/check.svg) center/contain no-repeat"></span>Marcar resolvido</span></div>
</div>
<p class="lbl">Selo de status</p>
<div class="r"><span style="padding:2px 8px;border-radius:var(--radius-sm);background:var(--success-subtle);color:var(--success);font:600 12px/18px var(--font-sans)">Completa</span><span style="padding:2px 8px;border-radius:var(--radius-sm);background:var(--accent-warm-subtle);color:var(--accent-warm-text);font:600 12px/18px var(--font-sans)">Ativo</span><span style="padding:2px 8px;border-radius:var(--radius-sm);background:var(--accent-warm-subtle);color:var(--accent-warm-text);font:600 12px/18px var(--font-sans)">Em breve</span></div>
</body></html>
