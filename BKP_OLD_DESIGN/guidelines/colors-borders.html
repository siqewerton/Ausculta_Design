<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;box-sizing:border-box}*{box-sizing:border-box}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px}
.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border)}
.n{font:600 13px/18px var(--font-sans)}.v{font:500 12px/16px var(--font-mono);color:var(--ink-muted)}
.lbl{font:500 12px/16px var(--font-sans);letter-spacing:.02em;color:var(--ink-muted)}</style></head><body><div class="row" style="align-items:stretch">
 <div class="sw"><div class="chip" style="background:var(--surface-000);border:2px solid var(--border)"></div><div class="n">border</div><div class="v">#D9D4C9 · #33403D — divisórias, sem significado</div></div>
 <div class="sw"><div class="chip" style="background:var(--surface-000);border:2px solid var(--border-strong)"></div><div class="n">border-strong</div><div class="v">#8C8377 · #6C7A76 — foco, FAB em repouso</div></div></div></body></html>
