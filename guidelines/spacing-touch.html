<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;box-sizing:border-box}*{box-sizing:border-box}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px}
.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border)}
.n{font:600 13px/18px var(--font-sans)}.v{font:500 12px/16px var(--font-mono);color:var(--ink-muted)}
.lbl{font:500 12px/16px var(--font-sans);letter-spacing:.02em;color:var(--ink-muted)}</style></head><body><div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><div style="width:48px;height:48px;border-radius:var(--radius-full);border:2px dashed var(--border-strong);display:grid;place-items:center"><div style="width:20px;height:20px;border-radius:var(--radius-full);background:var(--danger)"></div></div><div style="height:48px;padding:0 20px;border-radius:var(--radius-lg);background:var(--success);color:var(--on-success);display:flex;align-items:center;font:600 16px/20px var(--font-sans);letter-spacing:.01em">Aprovar e Sincronizar Prontuário</div><span class="v">min 48 × 48 px</span></div></body></html>
