<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;box-sizing:border-box}*{box-sizing:border-box}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px}
.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border)}
.n{font:600 13px/18px var(--font-sans)}.v{font:500 12px/16px var(--font-mono);color:var(--ink-muted)}
.lbl{font:500 12px/16px var(--font-sans);letter-spacing:.02em;color:var(--ink-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--success)"></div><div class="n">success</div><div class="v">#1E7A46 · #4FA873</div></div><div class="sw"><div class="chip" style="background:var(--success-subtle)"></div><div class="n">success-subtle</div><div class="v">#E4F0E7 · #122A1D</div></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="n">danger</div><div class="v">#B23A2E · #E08476</div></div><div class="sw"><div class="chip" style="background:var(--danger-subtle)"></div><div class="n">danger-subtle</div><div class="v">#F5E2DF · #2E1714</div></div></div></body></html>
