<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;box-sizing:border-box}*{box-sizing:border-box}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px}
.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border)}
.n{font:600 13px/18px var(--font-sans)}.v{font:500 12px/16px var(--font-mono);color:var(--ink-muted)}
.lbl{font:500 12px/16px var(--font-sans);letter-spacing:.02em;color:var(--ink-muted)}</style></head><body><div style="display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap"><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:4px;height:4px;background:var(--brand-subtle);border-radius:var(--radius-sm)"></div><span class="n">space-1</span><span class="v">4px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:8px;height:8px;background:var(--brand-subtle);border-radius:var(--radius-sm)"></div><span class="n">space-2</span><span class="v">8px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:12px;height:12px;background:var(--brand-subtle);border-radius:var(--radius-sm)"></div><span class="n">space-3</span><span class="v">12px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:16px;height:16px;background:var(--brand-subtle);border-radius:var(--radius-sm)"></div><span class="n">space-4</span><span class="v">16px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:24px;height:24px;background:var(--brand-subtle);border-radius:var(--radius-sm)"></div><span class="n">space-6</span><span class="v">24px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:32px;height:32px;background:var(--brand-subtle);border-radius:var(--radius-sm)"></div><span class="n">space-8</span><span class="v">32px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:48px;height:48px;background:var(--brand);border-radius:var(--radius-sm)"></div><span class="n">space-12</span><span class="v">48px</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><div style="width:64px;height:64px;background:var(--brand-subtle);border-radius:var(--radius-sm)"></div><span class="n">space-16</span><span class="v">64px</span></div></div></body></html>
