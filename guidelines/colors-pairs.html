<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;box-sizing:border-box}*{box-sizing:border-box}
.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px}
.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border)}
.n{font:600 13px/18px var(--font-sans)}.v{font:500 12px/16px var(--font-mono);color:var(--ink-muted)}
.lbl{font:500 12px/16px var(--font-sans);letter-spacing:.02em;color:var(--ink-muted)}</style></head><body><div class="row"><div style="flex:1;min-width:150px;background:var(--brand);color:var(--on-brand);border-radius:var(--radius-md);padding:12px 14px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--border)"><span style="font:600 16px/22px var(--font-sans)">Iniciar consulta</span><span style="font:500 12px/16px var(--font-mono);opacity:.85">on-brand / brand</span></div><div style="flex:1;min-width:150px;background:var(--success);color:var(--on-success);border-radius:var(--radius-md);padding:12px 14px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--border)"><span style="font:600 16px/22px var(--font-sans)">Aprovar e Sincronizar Prontuário</span><span style="font:500 12px/16px var(--font-mono);opacity:.85">on-success / success</span></div><div style="flex:1;min-width:150px;background:var(--accent-warm);color:var(--on-accent-warm);border-radius:var(--radius-md);padding:12px 14px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--border)"><span style="font:600 16px/22px var(--font-sans)">Ajustar</span><span style="font:500 12px/16px var(--font-mono);opacity:.85">on-accent-warm / accent-warm</span></div><div style="flex:1;min-width:150px;background:var(--danger);color:var(--on-danger);border-radius:var(--radius-md);padding:12px 14px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--border)"><span style="font:600 16px/22px var(--font-sans)">Gravando</span><span style="font:500 12px/16px var(--font-mono);opacity:.85">on-danger / danger</span></div></div></body></html>
