<!-- @dsCard group="Patterns" viewport="700x400" name="Padrões do protótipo" subtitle="Botões, badges, FAB, frase com evidência, alerta de dose" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px}.r{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.b{min-height:48px;padding:0 20px;border-radius:var(--radius-lg);font:600 16px/20px var(--font-sans);letter-spacing:.01em;display:inline-flex;align-items:center;gap:8px;border:none}
.pill{min-height:48px;padding:0 16px;border-radius:var(--radius-full);display:inline-flex;align-items:center;gap:8px;font:600 14px/20px var(--font-sans);border:2px solid}</style></head><body>
<div class="r"><span class="b" style="background:var(--brand);color:var(--on-brand)">Confirmar e iniciar</span><span class="b" style="background:var(--success);color:var(--on-success)"><span style="width:20px;height:20px;flex:none;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/circle-check.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/circle-check.svg) center/contain no-repeat"></span>Aprovar e Sincronizar Prontuário</span><span class="b" style="border:2px solid var(--border-strong);background:var(--surface-000);color:var(--ink)">Cancelar</span></div>
<div class="r"><span style="padding:4px 12px;border-radius:var(--radius-full);background:var(--brand-subtle);color:var(--brand-strong);font:500 12px/16px var(--font-sans);letter-spacing:.02em">via Long Life Pet</span>
<span class="pill" style="color:var(--accent-warm-text);background:var(--accent-warm-subtle);border-color:var(--accent-warm)"><span style="width:20px;height:20px;flex:none;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/wifi-off.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/wifi-off.svg) center/contain no-repeat"></span>Offline Mode</span>
<span class="pill" style="color:var(--brand-strong);background:var(--brand-subtle);border-color:var(--brand)"><span style="width:20px;height:20px;flex:none;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/refresh-cw.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/refresh-cw.svg) center/contain no-repeat"></span>Sincronizando</span>
<span class="pill" style="color:var(--success);background:var(--success-subtle);border-color:var(--success)"><span style="width:20px;height:20px;flex:none;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/circle-check.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/circle-check.svg) center/contain no-repeat"></span>Sincronizado</span>
<span style="width:56px;height:56px;border-radius:50%;background:var(--danger);color:var(--on-danger);box-shadow:var(--shadow-fab);display:grid;place-items:center;margin-left:8px"><span style="width:26px;height:26px;flex:none;background:currentColor;-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/mic.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/mic.svg) center/contain no-repeat"></span></span></div>
<div class="r" style="align-items:stretch"><div style="flex:1;min-width:260px;background:var(--surface-000);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:16px">
<div style="font:700 16px/22px var(--font-sans);margin-bottom:6px"><span style="font:500 13px/18px var(--font-mono);color:var(--brand);margin-right:8px">P</span>Plano</div>
<p style="margin:0;line-height:28px"><span style="text-decoration:underline dotted;text-decoration-color:var(--accent-warm);text-underline-offset:5px;background:var(--accent-warm-subtle);border-radius:4px">Meloxicam 0,4 mg/kg por via oral.</span> <span style="text-decoration:underline dotted;text-decoration-color:var(--border-strong);text-underline-offset:5px">Repouso com passeios curtos.</span></p></div>
<div style="flex:1;min-width:260px;background:var(--accent-warm-subtle);border:2px solid var(--accent-warm);border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;gap:10px"><span style="width:22px;height:22px;flex:none;background:var(--accent-warm);-webkit-mask:url(https://unpkg.com/lucide-static@0.460.0/icons/triangle-alert.svg) center/contain no-repeat;mask:url(https://unpkg.com/lucide-static@0.460.0/icons/triangle-alert.svg) center/contain no-repeat"></span><div><strong style="font-weight:600;color:var(--accent-warm-text)">Dose sugerida acima do limite — revisar</strong><div style="font:500 13px/18px var(--font-mono)">sugerido 0,4 · limite 0,2 mg/kg</div></div></div>
<div style="display:flex;gap:10px"><span class="b" style="flex:1;justify-content:center;border:2px solid var(--accent-warm);background:var(--surface-000);color:var(--accent-warm-text)">Aceitar</span><span class="b" style="flex:1;justify-content:center;background:var(--accent-warm);color:var(--on-accent-warm)">Ajustar</span></div></div></div>
</body></html>
